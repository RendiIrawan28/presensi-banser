# HTTPS via sertifikat Let's Encrypt untuk IP publik (tanpa domain).
# Ganti __PUBLIC_IP__ dan sesuaikan socket PHP-FPM sebelum mengaktifkan.
server {
    listen 80;
    server_name __PUBLIC_IP__;
    root /var/www/absensi-vps/public;

    # Wajib tetap tersedia untuk perpanjangan sertifikat 6-harian.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name __PUBLIC_IP__;
    root /var/www/absensi-vps/public;
    index index.html;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/__PUBLIC_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / { try_files $uri $uri/ =404; }
    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(?:sqlite|sqlite3|db|env|bak)$ { deny all; }
}
