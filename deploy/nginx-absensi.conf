# Salin sebagai /etc/nginx/sites-available/absensi-barcode
# Ganti absensi.contoh.com dan sesuaikan path / socket PHP-FPM.
server {
    listen 80;
    listen [::]:80;
    server_name absensi.contoh.com;

    root /var/www/absensi-vps/public;
    index index.html;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hanya API ini yang boleh diproses PHP.
    location = /material.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(?:sqlite|sqlite3|db|env|bak)$ { deny all; }
}
