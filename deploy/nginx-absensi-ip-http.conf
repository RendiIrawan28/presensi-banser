# HTTP sementara: validasi sertifikat SSL untuk IP publik.
# Ganti __PUBLIC_IP__ dengan alamat IPv4 publik VPS.
server {
    listen 80;
    server_name __PUBLIC_IP__;
    root /var/www/absensi-vps/public;
    index index.html;
    client_max_body_size 12m;

    # Jangan halangi challenge Let's Encrypt yang berada dalam .well-known.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / { try_files $uri $uri/ =404; }
    location = /material.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location = /api.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(?:sqlite|sqlite3|db|env|bak)$ { deny all; }
}
